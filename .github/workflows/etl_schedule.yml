name: ETL Incremental Load

on:
  schedule:
    # Runs daily at 06:00 UTC. Adjust the cron expression if you want a different time.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manually triggering the workflow from the GitHub Actions tab, for testing

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3 python-dotenv pandas

      - name: Run incremental ETL
        working-directory: etl
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DYNAMODB_TABLE: ${{ secrets.DYNAMODB_TABLE }}
        run: python incremental_load.py